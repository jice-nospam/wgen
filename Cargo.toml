[package]
name = "worldgen"
version = "0.5.2"
edition = "2021"

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = [
    "std", "async_executor", "bevy_asset", "bevy_log", "bevy_winit", "x11", "wayland",
    "multi_threaded", "3d_bevy_render",
] }
bevy_egui = { version = "=0.42.0", default-features = false, features = ["render", "default_fonts", "manage_clipboard"] }
egui = "0.36"
image = { version = "0.25.5", default-features = false, features = ["png"] }
exr = "1.5.2"
rand = "0.9.0"
noise = { version = "0.9", default-features = false }
serde = { version = "1.0", features = ["derive"] }
ron = "0.8.1"
num_cpus = "1.16.0"
rfd = "0.15.3"
wgpu = { version = "29", default-features = false, features = ["std", "wgsl"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
